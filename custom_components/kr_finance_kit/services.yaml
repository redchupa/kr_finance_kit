refresh_now:
  name: Refresh now
  description: Trigger an immediate refresh of market and disclosure data.

add_position:
  name: Add / update holding
  description: >
    Add or update a holding (quantity + average purchase price). Stored
    in encrypted ConfigEntry options — never persisted to source files.
    Supports Korean (KR) and US stocks only. Crypto, FX, and futures
    (BTC-USD, EUR=X, GC=F, …) expose price sensors but are not tracked
    as positions — pick from the "market" radio (KR or US).
  fields:
    ticker:
      name: Ticker / symbol
      description: >
        KR — 6-digit code, KOSDAQ adds the .KQ suffix (e.g. 005930,
        005930.KS, 035720.KS). US — symbol (e.g. AAPL, MSFT, BRK-B).
        Only letters, digits, '.' and '-' are accepted — spaces,
        currency symbols, and other special characters are rejected.
      required: true
      example: "005930"
      selector:
        text:
    quantity:
      name: Quantity
      description: Number of shares held (must be > 0).
      required: true
      example: "10"
      selector:
        number:
          min: 0.0001
          max: 1000000000
          mode: box
    avg_price:
      name: Average price (per share)
      description: >
        ⚠ Unit — enter in the market's native currency. KR positions:
        KRW (won). Example: avg price 60,000 KRW → enter `60000`
        (digits only, no comma or currency symbol). US positions: USD.
        Example: avg price $180.5 → enter `180.5` (decimals OK). Do
        NOT pre-convert. The integration handles the USD/KRW
        conversion itself and rolls the totals into KRW. This is the
        per-share average, not the total cost basis.
      required: true
      example: "60000"
      selector:
        number:
          min: 0.0001
          max: 1000000000
          mode: box
    market:
      name: Market
      description: >
        KR — Korean stocks (KOSPI, KOSDAQ). US — US stocks (NYSE, NASDAQ).
        Crypto, FX and futures (e.g. BTC-USD, EUR=X, GC=F) can't be tracked
        as holdings — add them on the options screen for price tracking only.
      required: true
      default: "KR"
      selector:
        select:
          translation_key: market
          options:
            - "KR"
            - "US"

remove_position:
  name: Remove holding
  description: Remove a previously added position. Matched by ticker + market.
  fields:
    ticker:
      name: Ticker / symbol
      description: Ticker code or symbol to remove (e.g. 005930, AAPL).
      required: true
      example: "005930"
      selector:
        text:
    market:
      name: Market
      description: KR (Korean stocks) or US (US stocks). Must match the market the position was added under.
      required: true
      default: "KR"
      selector:
        select:
          translation_key: market
          options:
            - "KR"
            - "US"
